name: WordMap self-test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: |
          python -m py_compile *.py
      - name: Core tests
        run: |
          python selftest.py
          python selftest_gpt2.py
          python selftest_v010.py
          python selftest_v012.py
          python selftest_v013.py
          python selftest_v014.py
          python selftest_v015.py
          python selftest_v016.py
          python selftest_v017.py
          python selftest_v0171.py
          python selftest_v0172.py
          python selftest_v018.py
          python selftest_visualizer.py
      - name: Runtime wiring
        run: |
          python -c "import launch; assert 'wuWorkspace' in launch.wordmap_mobile.HTML; assert hasattr(launch.core,'default_corpus_sync'); assert 'wuDeleteHistoryBtn' in launch.wordmap_mobile.HTML; assert launch.core.priming_version == '0.18.0'; assert launch.core.associative_cascade_version == '0.18.0'; print('WordMap v0.18 runtime wiring: OK')"
